<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Shield outline representing protection/safety monitoring -->
  <path d="M32 10 L48 16 V30 C48 41 41 48.5 32 53 C23 48.5 16 41 16 30 V16 Z"
        fill="none" stroke="url(#shield)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Heartbeat / vitals pulse line through the shield, representing SMI-V clinical monitoring -->
  <path d="M20 32 H26 L29 24 L34 40 L37 32 H44"
        fill="none" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
